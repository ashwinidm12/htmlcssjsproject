<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Shop | Cart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-fade">
    <header class="site-header">
        <div class="brand"><a href="index.html">Minimal Shop</a></div>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="cart.html" class="nav-link active">Cart <span id="cart-count">0</span></a>
        </nav>
    </header>

    <main class="cart-page">
        <section class="section-heading cart-heading">
            <div>
                <p class="eyebrow">Your cart</p>
                <h2>Review items before checkout</h2>
            </div>
            <p>Manage quantities, remove items, and see your total in real time.</p>
        </section>

        <div id="cart-empty" class="cart-empty hidden">
            <p>Your cart is empty.</p>
            <a href="index.html" class="button button-primary">Browse products</a>
        </div>

        <div id="cart-content" class="cart-content hidden">
            <div class="cart-items" id="cart-items"></div>
            <div class="cart-summary">
                <div class="summary-card">
                    <p class="eyebrow">Order summary</p>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong id="cart-total">$0.00</strong>
                    </div>
                    <button id="checkout-btn" class="button button-primary">Proceed to Checkout</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/cart.js"></script>
</body>
</html>
